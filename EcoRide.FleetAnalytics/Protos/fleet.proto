syntax = "proto3";

option csharp_namespace = "EcoRide.FleetAnalytics.Grpc";

package ecoRide.fleet;

service FleetService {
  rpc LockVehicle (LockVehicleRequest) returns (LockVehicleResponse);
}

message LockVehicleRequest {
  string vehicle_id = 1;
  string reason = 2;
}

message LockVehicleResponse {
  bool locked = 1;
  string message = 2;
}
